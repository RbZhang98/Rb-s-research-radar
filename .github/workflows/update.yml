name: Update Research Radar
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
# Same group as 1.0: queued old/new/manual/scheduled runs cannot write in parallel.
concurrency:
  group: research-radar-pages
  cancel-in-progress: false
jobs:
  collect-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      basic: ${{ steps.basic.outcome }}
      clinical: ${{ steps.clinical.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache
          key: radar-api-${{ github.run_id }}
          restore-keys: radar-api-
      - name: Tests before production mutation
        run: npm test
      - name: Activate accumulation once (production main only)
        run: python scripts/activate_v2.py
      - name: Basic metadata and retention
        id: basic
        continue-on-error: true
        run: python scripts/radar.py --radar basic
      - name: Clinical metadata and retention
        id: clinical
        continue-on-error: true
        run: python scripts/radar.py --radar clinical
      - name: Persist public history once, before deployment
        run: |
          git config user.name 'research-radar[bot]'
          git config user.email 'research-radar[bot]@users.noreply.github.com'
          git add data reports/last-run.json reports/clinical-last-run.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh independent Radar histories and indexes'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Incomplete collection is a failed update, even when failure status was published
        if: needs.collect-build.outputs.basic != 'success' || needs.collect-build.outputs.clinical != 'success'
        run: exit 1
